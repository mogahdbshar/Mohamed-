# بناء يدوي فقط لتوفير دقائق GitHub Actions.
# لن يبدأ البناء عند كل push أو pull request.

name: بناء APK يدوياً (DSTWR TV)

on:
  workflow_dispatch:

jobs:
  build:
    name: بناء وتجميع التطبيق (Build APK)
    runs-on: ubuntu-latest

    steps:
      - name: جلب الكود من GitHub
        uses: actions/checkout@v4

      - name: إعداد بيئة Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: توليد Gradle Wrapper إذا كان مفقوداً
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: استعادة مفتاح Debug إذا كان موجوداً
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: ضبط استراتيجية KSP
        run: |
          if [ -f "gradle.properties" ]; then
            sed -i 's/kotlin.compiler.execution.strategy=in-process/kotlin.compiler.execution.strategy=daemon/g' gradle.properties
          fi

      - name: بناء Debug APK
        run: ./gradlew assembleDebug --daemon --no-configuration-cache -Pkotlin.compiler.execution.strategy=daemon

      - name: رفع APK كمخرج
        uses: actions/upload-artifact@v4
        with:
          name: DSTWR-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
